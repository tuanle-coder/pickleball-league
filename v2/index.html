<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<style>
:root{
  --bg:#faf5ec;--surface:#fffaf2;--card:#ffffff;--card2:#fbf6ec;
  --line:#efe4d0;--line2:#e3d4b8;
  --ink:#2b1d0e;--ink2:#5b4630;--muted:#9a8468;
  --gold:#c9a14a;--gold2:#a87a24;--goldl:#f6ebd3;--goldll:#fbf5e8;
  --grad:linear-gradient(135deg,#f0d999 0%,#d4ad57 45%,#a87a24 100%);
  --brown:#3b2a14;
  --t1:#2563a8;--t1l:#e8eff8;--t2:#d0682a;--t2l:#fcede3;
  --good:#2f855a;--goodl:#e6f4ec;--warn:#b7791f;--warnl:#fdf3dc;--bad:#c2410c;
  --win:#c9a14a;--loss:#dccfb8;
  --disp:"Google Sans",system-ui,sans-serif;
  --sh:0 1px 0 rgba(59,42,20,.04);
  --r:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:"Google Sans",system-ui,-apple-system,sans-serif;overflow-x:hidden}
body{min-height:100vh;background:
  radial-gradient(520px 360px at 105% -8%,rgba(233,207,143,.55),transparent 65%),
  radial-gradient(480px 360px at -15% 25%,rgba(246,235,211,.9),transparent 60%),
  var(--bg);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit}
.mono{font-family:var(--disp);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{max-width:640px;margin:0 auto;padding-bottom:calc(100px + env(safe-area-inset-bottom))}

/* TOP BAR */
.top{position:sticky;top:0;z-index:30;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(250,245,236,.82);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:17px;color:#fff;
  background:var(--grad);box-shadow:0 0 0 2px #fff;text-shadow:none}
.brand{flex:1;min-width:0}
.brand small{display:block;font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.24em;color:var(--gold2);text-transform:uppercase}
.brand b{display:block;font-family:var(--disp);font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;color:var(--brown)}
.live{font-family:var(--disp);font-size:10px;font-weight:800;letter-spacing:.08em;padding:6px 10px;border-radius:4px;
  border:1px solid var(--line2);background:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap;text-transform:uppercase;color:var(--ink2)}
.live i{width:7px;height:7px;border-radius:50%;display:block}
.live i.on{background:var(--good);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,133,90,.5)}70%{box-shadow:0 0 0 7px rgba(47,133,90,0)}100%{box-shadow:0 0 0 0 rgba(47,133,90,0)}}
.miniscore{font-family:var(--disp);font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:4px;background:#fff;border:1px solid var(--line2);box-shadow:var(--sh)}

main{padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.ch h2{margin:0;font-family:var(--disp);font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--brown)}
.eyebrow{font-family:var(--disp);font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2)}
.hint{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:20px 8px}

/* HERO */
.hero{position:relative;border-radius:6px;padding:18px 14px 14px;margin-bottom:12px;overflow:hidden;
  background:linear-gradient(160deg,#fffaf0 0%,#f7e9c9 55%,#efd9a6 100%);border:1px solid #ead7ad;
  box-shadow:none}
.hero::before{content:"★";position:absolute;right:-8px;top:-30px;font-size:150px;color:rgba(201,161,74,.13);line-height:1}
.hero-title{text-align:center;font-family:var(--disp);font-weight:900;font-size:13px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:10px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;position:relative}
.side{text-align:center;min-width:0}
.side .nm{font-family:var(--disp);font-size:13px;font-weight:800;display:flex;justify-content:center;align-items:center;gap:6px}
.side .pts{font-family:var(--disp);font-size:54px;font-weight:900;line-height:1.05;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.side .sub{font-size:12px;color:var(--ink2);font-weight:600}
.lead{display:inline-block;margin-top:6px;font-family:var(--disp);font-size:9.5px;font-weight:900;letter-spacing:.12em;
  padding:4px 10px;border-radius:4px;background:var(--grad);color:#fff;text-shadow:0 1px 1px rgba(80,50,10,.35)}
.vs{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-size:12px;font-weight:900;color:#fff;
  background:var(--grad);box-shadow:0 0 0 3px #fff}
.share{margin-top:14px;position:relative}
.share .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);font-weight:700;margin-bottom:6px}
.share .lab b{font-family:var(--disp)}
.split{height:9px;border-radius:4px;background:#efe3cc;display:flex;gap:2px;overflow:hidden}
.split i{display:block;height:100%}
.split i:first-child{border-radius:4px 0 0 4px}.split i:last-child{border-radius:0 4px 4px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;position:relative}
.kpi{background:rgba(255,255,255,.75);border:1px solid #efdcb3;border-radius:6px;padding:9px 10px}
.kpi b{display:block;font-family:var(--disp);font-size:18px;font-weight:800;color:var(--brown)}
.kpi span{font-size:11px;color:var(--ink2);font-weight:600}
.tdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}

/* NEXT MATCH */
.next{border:1.5px solid #e6cf98;background:linear-gradient(180deg,#fffdf7,#fff)}
.vsrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:4px 0 12px}
.vsrow .pr{font-weight:800;font-size:15px;line-height:1.35}
.vsrow .pr:last-child{text-align:right}
.vsrow .x{font-family:var(--disp);font-size:11px;font-weight:800;color:var(--gold2)}

/* HIGHLIGHTS */
.hl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hlc{background:var(--goldll);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0;text-align:left}
.hlc .ic{font-size:18px}
.hlc .k{font-family:var(--disp);font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin-top:6px}
.hlc .v{font-weight:800;font-size:15px;margin-top:3px;line-height:1.3;word-break:break-word;color:var(--brown)}
.hlc .s{font-size:12px;color:var(--ink2);margin-top:2px;font-weight:600}
button.hlc{font:inherit;color:inherit}

/* ROUND ROWS */
.rrow{display:grid;grid-template-columns:58px 24px 1fr 24px 52px;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rnum{font-family:var(--disp);font-size:11px;color:var(--muted);font-weight:800}
.rv{font-family:var(--disp);font-weight:800;font-size:15px;text-align:center}
.rv.dim{opacity:.4}
.badge{font-family:var(--disp);font-size:9.5px;font-weight:800;letter-spacing:.05em;padding:4px 8px;border-radius:4px;text-align:center;white-space:nowrap}
.b-ok{background:var(--goodl);color:var(--good)}
.b-live{background:var(--warnl);color:var(--warn)}
.b-idle{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.b-draw{background:var(--goldl);color:var(--gold2)}
.lrow{padding:10px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .top2{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:800;margin-bottom:7px}
.lrow .top2 .mono{font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;font-weight:600}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* TAB BAR */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:560px;z-index:40;
  background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line2);border-radius:6px;display:flex;padding:5px;box-shadow:none}
.tabbar button{flex:1;background:none;border:0;color:var(--muted);padding:8px 2px 7px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;font-weight:800;transition:all .18s;min-width:0}
.tabbar button.on{color:#fff;background:var(--brown);box-shadow:none}
.tabbar button.on svg{color:#f0d999}
.tabbar svg{width:21px;height:21px}

/* CONTROLS */
.btn{border:0;border-radius:6px;padding:12px 16px;font-weight:800;font-size:14px;color:var(--brown);display:inline-flex;align-items:center;gap:6px;justify-content:center;
  background:var(--grad);box-shadow:none}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--gold2);border:1.5px solid #e6cf98;box-shadow:none}
.btn.danger{background:#fff4ee;color:var(--bad);border:1px solid #f3c9b4;box-shadow:none}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:6px}
.btn.block{width:100%}
.iconbtn{border:0;background:transparent;color:var(--muted);width:38px;height:38px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto}
.iconbtn:active,.iconbtn:hover{background:var(--goldl);color:var(--brown)}
.iconbtn:disabled{opacity:.3}
.iconbtn svg{width:18px;height:18px}
.field{width:100%;border:1.5px solid var(--line2);border-radius:6px;padding:11px 13px;font-size:16px;background:#fff;color:var(--ink);font-weight:600}
.field::placeholder{color:#bfae94;font-weight:500}
.field:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,161,74,.2)}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:6px;font-weight:800;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--brown);color:#fff}
.seg.full{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
.seg.full button{padding:8px 2px;font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.lbl{font-family:var(--disp);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);margin:0 0 7px;font-weight:800}
.rk{width:20px;height:20px;border-radius:4px;font-family:var(--disp);font-size:10.5px;font-weight:900;display:inline-grid;place-items:center;flex:0 0 auto;
  background:var(--grad);color:#fff;text-shadow:0 1px 1px rgba(80,50,10,.3)}
.rk.B{background:#efe3cc;color:var(--ink2);text-shadow:none}
.banner{background:var(--warnl);border:1px solid #f1d9a4;color:#7a5414;border-radius:6px;padding:12px;font-size:13.5px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ENTRY */
.rstrip{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;scroll-behavior:smooth}
.rstrip::-webkit-scrollbar{display:none}
.rchip{flex:0 0 auto;width:52px;height:58px;border-radius:6px;border:1.5px solid var(--line2);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:800;font-size:18px;color:var(--ink2);position:relative}
.rchip small{font-size:8.5px;font-weight:800;color:var(--muted);letter-spacing:.08em}
.rchip.done{border-color:#e6cf98;color:var(--gold2);background:var(--goldll)}
.rchip.done::after,.rchip.part::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%}
.rchip.done::after{background:var(--good)}
.rchip.part::after{background:var(--warn)}
.rchip.on{background:var(--brown);border-color:var(--brown);color:#f0d999;box-shadow:none}
.rchip.on small{color:#e6cf98}.rchip.on::after{display:none}
.rhead{display:flex;align-items:center;gap:6px}
.rhead h3{margin:0;font-family:var(--disp);font-size:21px;font-weight:900;flex:1;color:var(--brown)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;margin-top:12px}
.duel .s{text-align:center}
.duel .s div{font-size:13px;font-weight:800;color:var(--ink2)}
.duel .s b{font-family:var(--disp);font-size:38px;font-weight:900;line-height:1.1}
.duel .c{font-family:var(--disp);font-size:10px;font-weight:800;color:var(--gold2);letter-spacing:.14em;padding-bottom:12px}
.prog{height:8px;background:#f1e6d1;border-radius:4px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--grad);border-radius:4px;transition:width .3s}
.rmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px;font-weight:600}
.rmeta b{font-family:var(--disp);color:var(--ink2)}

.match{background:#fff;border:1px solid var(--line2);border-radius:6px;margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.match.is-next{border:1.5px solid var(--gold);box-shadow:0 0 0 4px rgba(201,161,74,.16),var(--sh)}
.mhead{display:flex;align-items:center;gap:8px;padding:11px 12px 9px 14px;background:var(--goldll);border-bottom:1px solid var(--line)}
.mno{font-family:var(--disp);font-size:11px;font-weight:900;color:#fff;background:var(--brown);border-radius:4px;padding:3px 7px}
.mtitle{flex:1;min-width:0;font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--brown)}
.mtime{font-family:var(--disp);font-size:12px;color:var(--gold2);font-weight:800}
.side2{display:grid;grid-template-columns:5px 1fr auto;gap:10px;align-items:center;padding:9px 10px 9px 0;border-top:1px solid var(--line)}
.mhead+.side2{border-top:0}
.side2 .bar{height:100%;min-height:46px;border-radius:0 4px 4px 0;background:var(--tc);opacity:.35}
.side2.won{background:linear-gradient(90deg,var(--tcl),#fff 80%)}
.side2.won .bar{opacity:1}
.side2.lost .names{color:var(--muted)}
.who{min-width:0}
.tname{font-size:12px;font-weight:800;color:var(--tc);display:flex;align-items:center;gap:6px}
.plus{font-family:var(--disp);font-size:10px;font-weight:900;padding:1px 7px;border-radius:4px;background:var(--tc);color:#fff}
.names{font-weight:800;font-size:15px;margin-top:2px;line-height:1.3;word-break:break-word}
.names.none{color:#bfae94;font-weight:600;font-size:13.5px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:36px;height:44px;border-radius:6px;border:1.5px solid var(--line2);background:#fff;font-size:20px;font-weight:700;color:var(--ink2);display:grid;place-items:center}
.stepper button:active{background:var(--goldl)}
.stepper input{width:56px;height:50px;border-radius:6px;border:1.5px solid var(--line2);background:var(--surface);text-align:center;font-family:var(--disp);font-size:24px;font-weight:900;color:var(--ink);-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,161,74,.2)}
.side2.won .stepper input{border-color:var(--tc);color:var(--tc);background:#fff;box-shadow:0 0 0 1px var(--tc) inset}
.mfoot{display:flex;align-items:center;gap:6px;padding:6px 8px 8px 14px;border-top:1px solid var(--line)}
.mfoot .warnline{flex:1;font-size:12px;color:var(--warn);font-weight:700}
.mpanel{padding:12px 14px 14px;border-top:1px solid var(--line);background:var(--card2);display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line2);background:#fff;border-radius:4px;padding:6px 12px 6px 6px;font-size:13px;font-weight:700;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--tc);border-color:var(--tc);color:#fff}
.chip.on .rk{background:rgba(255,255,255,.28);color:#fff}
.chip.more{padding:6px 12px;color:var(--gold2);border-style:dashed;border-color:#e6cf98}

/* thẻ trận 2 cột */
.mlabel{flex:1;min-width:0;border:0;background:transparent;font-family:inherit;font-weight:800;font-size:16px;color:var(--brown);padding:4px 6px;border-radius:4px}
.mlabel:focus{outline:2px solid #e6cf98;background:#fff}
.mhead .mno{white-space:nowrap}
.mhead{gap:4px;padding-right:4px}
.mhead .iconbtn{width:32px;height:34px}
.sdot.ok{width:20px;height:20px;font-size:11px}
.sdot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-size:12px;font-weight:900}
.sdot.ok{background:var(--goodl);color:var(--good)}
.sdot.run{width:12px;height:12px;margin:0 5px;background:var(--warn);animation:pulse2 1.6s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(183,121,31,.5)}70%{box-shadow:0 0 0 7px rgba(183,121,31,0)}100%{box-shadow:0 0 0 0 rgba(183,121,31,0)}}
.cols{display:grid;grid-template-columns:1fr 1fr}
.col{padding:12px 10px 12px 12px;min-width:0}
.col+.col{border-left:1px solid var(--line)}
.col.won{background:linear-gradient(180deg,var(--tcl),#fff 85%)}
.col .tn{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--disp);font-size:13px;font-weight:800;color:var(--tc);margin-bottom:4px}
.col .picked{font-weight:800;font-size:14.5px;line-height:1.35;min-height:20px;margin-bottom:10px;word-break:break-word}
.col.lost .picked{color:var(--muted)}
.col .picked.none{color:#bfae94;font-weight:600;font-size:13px}
/* ô tên đều nhau: lưới cột bằng nhau, tên dài thì cắt "…" */
.col .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.col .chip{width:100%;min-width:0;font-size:12.5px;padding:5px 8px 5px 5px;height:34px}
.chip .cn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useRef,useCallback}=React;

const ROOT="league_ab";
const LS_KEY="pb_ab_cache_v1";
const DEFAULT_TEMPLATE=["Đôi Hạng A","Đôi Hạng B"];
const TEAM_COLOR={"1":"var(--t1)","2":"var(--t2)"};
const TEAM_HEX={"1":"#2563a8","2":"#d0682a"};
const TEAM_LIGHT={"1":"#e8eff8","2":"#fcede3"};

// ─── DATA HELPERS ────────────────────────────────────────────────────────────
function blankMatch(label){return{label:label||"",a:[],b:[],sa:"",sb:""};}
function buildRounds(n,template){return Array.from({length:n},()=>({matches:template.map(blankMatch)}));}
const DEFAULT_DATA={
  config:{ptsWin:3,template:DEFAULT_TEMPLATE,startDate:"2026-10-05"},
  teams:{"1":{name:"Team 1",members:[]},"2":{name:"Team 2",members:[]}},
  rounds:buildRounds(10,DEFAULT_TEMPLATE),
};

// Firebase lưu mảng thành object {0:..,1:..} và bỏ mảng rỗng → chuẩn hoá lại
function toArr(v){
  if(!v)return[];
  if(Array.isArray(v))return v;
  if(typeof v==="object")return Object.keys(v).sort((a,b)=>a-b).map(k=>v[k]);
  return[];
}
function normalize(d){
  d=d||{};
  const cfg=d.config||{};
  const template=toArr(cfg.template).filter(Boolean).map(String);
  const teams={};
  ["1","2"].forEach(t=>{
    const x=(d.teams||{})[t]||{};
    teams[t]={name:x.name||("Team "+t),
      members:toArr(x.members).filter(m=>m&&m.name).map(m=>({name:String(m.name),rank:m.rank==="B"?"B":"A"}))};
  });
  const rounds=toArr(d.rounds).map(r=>({
    date:r&&r.date?String(r.date):"",
    matches:toArr(r&&r.matches).filter(Boolean).map(m=>({
      label:m.label||"",
      a:toArr(m.a).filter(Boolean),
      b:toArr(m.b).filter(Boolean),
      sa:m.sa==null?"":String(m.sa),
      sb:m.sb==null?"":String(m.sb),
    })),
  }));
  return{
    config:{ptsWin:Number(cfg.ptsWin)||3,template:template.length?template:DEFAULT_TEMPLATE,startDate:cfg.startDate||DEFAULT_START},
    teams,rounds,
  };
}
function setIn(obj,path,value){
  if(!path.length)return value;
  const [k,...rest]=path;
  const base=Array.isArray(obj)?[...obj]:{...(obj||{})};
  base[k]=setIn(obj?obj[k]:undefined,rest,value);
  return base;
}

// Tên trận có thể kèm giờ: "Đôi Hạng A · 18:30"
const TIME_RE=/\s*·?\s*(\d{1,2}:\d{2})\s*$/;
function timeOf(label){const m=(label||"").match(TIME_RE);return m?m[1]:"";}
function cleanLabel(label){return(label||"").replace(TIME_RE,"").trim()||"Trận";}
function rankOfLabel(label){const s=(label||"").toLowerCase();if(/hạng\s*a\b/.test(s)&&!/hạng\s*b\b/.test(s))return"A";if(/hạng\s*b\b/.test(s)&&!/hạng\s*a\b/.test(s))return"B";return null;}
function initials(n){const p=n.trim().split(/\s+/);return((p.length>1?p[p.length-2][0]:"")+p[p.length-1][0]).toUpperCase();}
const pctTxt=v=>v==null?"–":Math.round(v*100)+"%";
const sgn=v=>(v>0?"+":"")+v;

// Team 1 luôn là bên a, Team 2 luôn là bên b
function winner(m){
  if(m.sa===""||m.sb==="")return null;
  const a=Number(m.sa),b=Number(m.sb);
  if(isNaN(a)||isNaN(b)||a===b)return null;
  return a>b?"1":"2";
}
function isDone(r){return r.matches.length>0&&r.matches.every(m=>winner(m)!==null);}
function hasScore(r){return r.matches.some(m=>m.sa!==""||m.sb!=="");}
function hasData(r){return r.matches.some(m=>m.sa!==""||m.sb!==""||m.a.length||m.b.length);}
// Hiệu số điểm của vòng (tổng điểm bóng Team 1 − Team 2), dùng để phân định khi hoà điểm vòng
function roundDiff(r){return r.matches.reduce((d,m)=>winner(m)?d+Number(m.sa)-Number(m.sb):d,0);}
function roundWinner(r,s){
  if(s["1"]!==s["2"])return s["1"]>s["2"]?"1":"2";
  const d=roundDiff(r);
  return d>0?"1":d<0?"2":"0";
}

// ─── LỊCH THI ĐẤU ────────────────────────────────────────────────────────────
const DEFAULT_START="2026-10-05";
const WD=["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"];
function parseD(s){const[y,m,d]=(s||"").split("-").map(Number);return y&&m&&d?new Date(y,m-1,d):null;}
function isoD(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function nextMonday(dt){const d=new Date(dt);d.setDate(d.getDate()+((8-d.getDay())%7||7));return d;}
// Vòng 1 = ngày bắt đầu giải; vòng có ngày sửa tay giữ nguyên; các vòng còn lại = thứ 2 kế tiếp sau vòng trước
function roundDates(data){
  const out=[];let prev=null;
  data.rounds.forEach((r,i)=>{
    const iso=i===0?(r.date||data.config.startDate):(r.date||(prev&&parseD(prev)?isoD(nextMonday(parseD(prev))):""));
    out.push({iso,manual:i>0&&!!r.date});prev=iso;
  });
  return out;
}
function fmtLong(iso){const d=parseD(iso);if(!d)return"";return WD[d.getDay()]+", "+String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();}
function fmtShort(iso){const d=parseD(iso);return d?String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0"):"";}
// Sửa ngày vòng 1 = đổi ngày bắt đầu giải; vòng khác lưu ngày sửa tay
function setRoundDate(data,save,i,v){
  if(!v)return;
  if(i===0){save(["config","startDate"],v);if(data.rounds[0].date)save(["rounds",0,"date"],null);}
  else save(["rounds",i,"date"],v);
}
const openPicker=e=>{try{e.currentTarget.showPicker();}catch(_){}};

function computeStats(data){
  const P=data.config.ptsWin;
  const total={"1":0,"2":0},wins={"1":0,"2":0};
  const byLabel={};
  let played=0;
  const perRound=data.rounds.map(r=>{
    const s={"1":0,"2":0};
    r.matches.forEach(m=>{
      const w=winner(m);if(!w)return;
      s[w]+=P;total[w]+=P;wins[w]++;played++;
      const L=cleanLabel(m.label);
      byLabel[L]=byLabel[L]||{"1":0,"2":0};byLabel[L][w]++;
    });
    return s;
  });
  const roundWins={"1":0,"2":0,draw:0};
  let roundsDone=0;
  data.rounds.forEach((r,i)=>{
    if(!isDone(r))return;roundsDone++;
    const w=roundWinner(r,perRound[i]);
    if(w==="0")roundWins.draw++;else roundWins[w]++;
  });
  return{P,total,wins,perRound,byLabel,played,roundsDone,roundWins};
}

// ─── PHÂN TÍCH THÀNH VIÊN ────────────────────────────────────────────────────
function analyze(data){
  const P=data.config.ptsWin;
  const info={};
  ["1","2"].forEach(t=>data.teams[t].members.forEach(m=>{info[m.name]={team:t,rank:m.rank};}));
  const pl={},pairs={};
  let big=null;
  const get=(n,t)=>pl[n]||(pl[n]={name:n,team:(info[n]||{}).team||t,rank:(info[n]||{}).rank||"?",games:[],partners:{},opps:{}});
  data.rounds.forEach((r,ri)=>r.matches.forEach((m,mi)=>{
    const w=winner(m);if(!w)return;
    const sa=Number(m.sa),sb=Number(m.sb);
    if(!big||Math.abs(sa-sb)>big.margin)big={margin:Math.abs(sa-sb),ri,mi,m,w};
    [["1",m.a,m.b,sa,sb],["2",m.b,m.a,sb,sa]].forEach(([t,mine,theirs,my,th])=>{
      const won=w===t;
      if(mine.length>=2){
        const names=[...mine].sort(),k=names.join(" & ");
        pairs[k]=pairs[k]||{names,team:t,p:0,w:0};pairs[k].p++;if(won)pairs[k].w++;
      }
      mine.forEach(n=>{
        const x=get(n,t);
        x.games.push({ri,mi,label:m.label,won,my,th,partners:mine.filter(y=>y!==n),opps:theirs});
        mine.forEach(y=>{if(y===n)return;const q=x.partners[y]=x.partners[y]||{p:0,w:0};q.p++;if(won)q.w++;});
        theirs.forEach(y=>{const q=x.opps[y]=x.opps[y]||{p:0,w:0};q.p++;if(won)q.w++;});
      });
    });
  }));
  Object.keys(info).forEach(n=>get(n,info[n].team));
  Object.values(pl).forEach(x=>{
    const g=x.games;
    x.p=g.length;x.w=g.filter(y=>y.won).length;x.l=x.p-x.w;
    x.pct=x.p?x.w/x.p:null;
    x.pf=g.reduce((s,y)=>s+y.my,0);x.pa=g.reduce((s,y)=>s+y.th,0);x.diff=x.pf-x.pa;
    x.avgF=x.p?x.pf/x.p:0;x.avgA=x.p?x.pa/x.p:0;
    x.closeW=g.filter(y=>y.won&&y.my-y.th<=2).length;
    x.closeL=g.filter(y=>!y.won&&y.th-y.my<=2).length;
    let s=0;for(let i=g.length-1;i>=0&&g[i].won===g[g.length-1].won;i--)s++;
    x.streak=g.length?{won:g[g.length-1].won,n:s}:null;
    x.form=g.slice(-5).map(y=>y.won);
    x.formW=x.form.filter(Boolean).length;
    x.pts=x.w*P;
  });
  const rankAvg={};
  ["A","B"].forEach(r=>{
    const xs=Object.values(pl).filter(x=>x.rank===r);
    const p=xs.reduce((s,x)=>s+x.p,0),w=xs.reduce((s,x)=>s+x.w,0);
    rankAvg[r]=p?w/p:null;
  });
  return{pl,pairs,big,rankAvg,P};
}

function insights(x,an){
  const out=[];
  const add=(tone,ic,html)=>out.push({tone,ic,html});
  if(!x.p){add("info","🕒","Chưa thi đấu trận nào — phân tích sẽ xuất hiện sau trận đầu tiên.");return out;}
  if(x.p<3)add("info","📊",`Mới có <b>${x.p} trận</b> — số liệu chưa đủ tin cậy, cần thêm ít nhất 3 trận.`);

  if(x.streak&&x.streak.n>=3)
    x.streak.won?add("good","🔥",`Đang có <b>chuỗi ${x.streak.n} trận thắng</b> liên tiếp — giữ nguyên cặp đang ăn ý.`)
                :add("warn","🧊",`Đang <b>thua ${x.streak.n} trận liên tiếp</b> — cân nhắc đổi cặp hoặc điều chỉnh lối đánh.`);

  if(x.p>=6){
    const rec=x.games.slice(-4),rp=rec.filter(g=>g.won).length/rec.length;
    if(rp-x.pct>=0.25)add("good","📈",`Phong độ <b>đang lên</b>: thắng ${Math.round(rp*100)}% trong 4 trận gần nhất (cả giải ${pctTxt(x.pct)}).`);
    else if(x.pct-rp>=0.25)add("warn","📉",`Phong độ <b>đi xuống</b>: chỉ thắng ${Math.round(rp*100)}% trong 4 trận gần nhất (cả giải ${pctTxt(x.pct)}).`);
  }

  const avg=an.rankAvg[x.rank];
  if(avg!=null&&x.p>=3){
    const d=Math.round((x.pct-avg)*100);
    if(d>=15)add("good","⭐",`Tỉ lệ thắng <b>cao hơn ${d}%</b> so với mặt bằng Hạng ${x.rank} (${pctTxt(avg)}).`);
    else if(d<=-15)add("warn","🎯",`Tỉ lệ thắng <b>thấp hơn ${-d}%</b> so với mặt bằng Hạng ${x.rank} (${pctTxt(avg)}).`);
  }
  if(x.p>=6&&x.rank==="B"&&x.pct>=0.75)add("good","⬆️",`Thắng ${pctTxt(x.pct)} sau ${x.p} trận — có thể cân nhắc <b>lên Hạng A</b>.`);
  if(x.p>=6&&x.rank==="A"&&x.pct<=0.3)add("warn","⬇️",`Chỉ thắng ${pctTxt(x.pct)} sau ${x.p} trận — có thể cân nhắc <b>xếp Hạng B</b> để cân bằng.`);

  const ps=Object.entries(x.partners).filter(([,q])=>q.p>=2);
  if(ps.length){
    const best=[...ps].sort((a,b)=>b[1].w/b[1].p-a[1].w/a[1].p||b[1].p-a[1].p)[0];
    const worst=[...ps].sort((a,b)=>a[1].w/a[1].p-b[1].w/b[1].p||b[1].p-a[1].p)[0];
    if(best[1].w/best[1].p>=0.6)add("good","🤝",`Ăn ý nhất khi đánh cùng <b>${best[0]}</b> (thắng ${best[1].w}/${best[1].p}) — nên ưu tiên xếp cặp.`);
    if(worst[0]!==best[0]&&worst[1].w/worst[1].p<=0.34)add("warn","🔁",`Hiệu quả thấp khi đánh cùng <b>${worst[0]}</b> (thắng ${worst[1].w}/${worst[1].p}) — thử đổi cặp.`);
  }
  const os=Object.entries(x.opps).filter(([,q])=>q.p>=2).sort((a,b)=>a[1].w/a[1].p-b[1].w/b[1].p||b[1].p-a[1].p);
  if(os.length&&os[0][1].w/os[0][1].p<=0.34)add("warn","🛡️",`Hay gặp khó trước <b>${os[0][0]}</b> (chỉ thắng ${os[0][1].w}/${os[0][1].p}) — nên chuẩn bị chiến thuật riêng.`);
  if(os.length&&os[os.length-1][1].w/os[os.length-1][1].p>=0.75)add("good","💪",`Đánh rất tốt khi gặp <b>${os[os.length-1][0]}</b> (thắng ${os[os.length-1][1].w}/${os[os.length-1][1].p}).`);

  if(x.closeL>=2&&x.closeL>x.closeW)add("warn","⏱️",`Thua sát nút <b>${x.closeL} trận</b> (cách ≤2 điểm) — tập trung giữ tâm lý ở các điểm cuối.`);
  else if(x.closeW>=2&&x.closeW>x.closeL)add("good","🧠",`Bản lĩnh ở trận sát nút: thắng <b>${x.closeW}</b>, thua ${x.closeL} trận cách ≤2 điểm.`);

  if(x.p>=3&&x.pct<0.5&&x.avgA>=9)add("info","🏓",`Đối thủ ghi trung bình <b>${x.avgA.toFixed(1)} điểm/trận</b> — cải thiện giao bóng & trả giao để hạn chế điểm mất.`);
  if(x.p>=3&&x.diff>=x.p*4)add("good","🚀",`Thắng áp đảo: hiệu số trung bình <b>${sgn(+(x.diff/x.p).toFixed(1))} điểm/trận</b>.`);
  if(out.length===0||(out.length===1&&out[0].tone==="info"&&x.p>=3))add("info","✅",`Phong độ ổn định quanh mức ${pctTxt(x.pct)} — chưa có điểm bất thường cần lưu ý.`);
  return out;
}

// ─── FIREBASE HOOK ───────────────────────────────────────────────────────────
function useLeague(){
  const [data,setData]=useState(()=>{
    try{const c=localStorage.getItem(LS_KEY);if(c)return normalize(JSON.parse(c));}catch(e){}
    return normalize(DEFAULT_DATA);
  });
  const [status,setStatus]=useState("connecting");
  const [loaded,setLoaded]=useState(false);

  useEffect(()=>{
    let started=false;
    const start=()=>{
      const fb=window.__fb;if(!fb||started)return;started=true;
      const r=fb.ref(fb.db,ROOT);
      fb.onValue(r,snap=>{
        const v=snap.val();
        if(!v){fb.set(r,DEFAULT_DATA);return;}
        const n=normalize(v);
        setData(n);setLoaded(true);
        try{localStorage.setItem(LS_KEY,JSON.stringify(n));}catch(e){}
      },err=>{console.error(err);setStatus("offline");setLoaded(true);});
      fb.onValue(fb.ref(fb.db,".info/connected"),s=>setStatus(s.val()?"live":"offline"));
    };
    if(window.__fb)start();else window.addEventListener("fb-ready",start);
    const t=setTimeout(()=>{if(!window.__fb){setStatus("offline");setLoaded(true);}},8000);
    return()=>{window.removeEventListener("fb-ready",start);clearTimeout(t);};
  },[]);

  // Ghi đúng nhánh dữ liệu thay đổi → nhiều điện thoại nhập cùng lúc không đè nhau
  const save=useCallback((path,value)=>{
    setData(prev=>normalize(setIn(prev,path,value)));
    const fb=window.__fb;
    if(fb){
      const p=path.length?ROOT+"/"+path.join("/"):ROOT;
      fb.set(fb.ref(fb.db,p),value).catch(e=>alert("Không lưu được: "+e.message));
    }
  },[]);

  return{data,status,loaded,save};
}

function Picker({team,t,sel,onChange,rank}){
  const [all,setAll]=useState(!rank);
  const ms=[...team.members].sort((a,b)=>a.rank.localeCompare(b.rank))
    .filter(m=>all||m.rank===rank||sel.includes(m.name));
  const tog=n=>{
    if(sel.includes(n))onChange(sel.filter(x=>x!==n));
    else onChange(sel.length>=2?[sel[1],n]:[...sel,n]);
  };
  return(
    <div className="chips" style={{"--tc":TEAM_HEX[t]}}>
      {ms.map(m=>(
        <button key={m.name} className={"chip"+(sel.includes(m.name)?" on":"")} onClick={()=>tog(m.name)}>
          <span className={"rk "+m.rank}>{m.rank}</span><span className="cn">{m.name}</span>
        </button>
      ))}
      {rank&&<button className="chip more" onClick={()=>setAll(!all)}>{all?"Chỉ Hạng "+rank:"+ Hạng khác"}</button>}
      {!team.members.length&&<span className="muted" style={{fontSize:12}}>Chưa có thành viên</span>}
    </div>
  );
}

function MatchCard({m,mi,ri,data,save,isNext,onDelete,onScoreBlur}){
  const w=winner(m);
  const [open,setOpen]=useState(!w);
  const [label,setLabel]=useState(m.label);
  useEffect(()=>setLabel(m.label),[m.label]);
  const base=["rounds",ri,"matches",mi];
  const P=data.config.ptsWin;
  const tie=m.sa!==""&&m.sb!==""&&Number(m.sa)===Number(m.sb);

  // gọi như hàm (không phải <Col/>) để không bị dựng lại component mỗi lần gõ
  const col=t=>{
    const key=t==="1"?"a":"b",won=w===t;
    return(
      <div className={"col"+(won?" won":"")+(w&&!won?" lost":"")} style={{"--tc":TEAM_HEX[t],"--tcl":TEAM_LIGHT[t]}}>
        <div className="tn">
          <span>{data.teams[t].name}</span>
          {won&&<span className="plus">+{P}</span>}
        </div>
        <div className={"picked"+(m[key].length?"":" none")}>{m[key].length?m[key].join(" & "):"Chọn người đánh"}</div>
        {open&&<Picker team={data.teams[t]} t={t} sel={m[key]} rank={null} onChange={v=>save([...base,key],v)}/>}
      </div>
    );
  };

  return(
    <div className={"match"+(isNext?" is-next":"")}>
      <div className={"mhead"+(mi%2?" alt":"")}>
        <span className="mno">Trận {mi+1}</span>
        <input className="mlabel" value={label} placeholder="Tên trận"
          onChange={e=>setLabel(e.target.value)}
          onBlur={()=>{if(label!==m.label)save([...base,"label"],label);}}/>
        {w?<span className="sdot ok" title="Đã xong">✓</span>:isNext?<span className="sdot run" title="Đang đấu"/>:null}
        <button className="iconbtn" aria-label={open?"Thu gọn":"Đổi người"} title={open?"Thu gọn":"Đổi người"} onClick={()=>setOpen(!open)}>{open?<IcUp/>:<IcPen/>}</button>
        <button className="iconbtn" aria-label="Xoá trận" onClick={onDelete}><IcTrash/></button>
      </div>
      <div className="cols">{col("1")}{col("2")}</div>
      <div className="score">
        <input type="number" inputMode="numeric" min="0" value={m.sa} placeholder="0" className={w==="1"?"w":""} style={{"--tc":TEAM_HEX["1"]}}
          onChange={e=>save([...base,"sa"],e.target.value)} onBlur={onScoreBlur}/>
        <span className="colon">:</span>
        <input type="number" inputMode="numeric" min="0" value={m.sb} placeholder="0" className={w==="2"?"w":""} style={{"--tc":TEAM_HEX["2"]}}
          onChange={e=>save([...base,"sb"],e.target.value)} onBlur={onScoreBlur}/>
      </div>
      {tie&&<div className="warnline2">Tỉ số đang hoà — trận chưa được tính điểm</div>}
    </div>
  );
}

function Entry({data,save,loaded,go}){
  const [ri,setRi]=useState(0);
  const picked=useRef(false);
  const stripRef=useRef(null);
  // Thứ tự hiển thị: trận chưa xong lên trước, trận đã xong xuống cuối.
  // Chỉ sắp xếp lại khi đổi vòng hoặc sau khi rời ô tỉ số, để thẻ không nhảy chỗ lúc đang gõ.
  const [sortTick,setSortTick]=useState(0);
  const frozen=useRef({key:"",order:[]});
  const resort=useCallback(()=>setTimeout(()=>{
    const a=document.activeElement;
    if(a&&a.closest&&a.closest(".score"))return;
    setSortTick(t=>t+1);
  },300),[]);

  // Lần đầu mở: nhảy tới vòng chưa hoàn thành gần nhất
  useEffect(()=>{
    if(picked.current||!loaded||!data.rounds.length)return;
    let i=data.rounds.findIndex(r=>!isDone(r));
    if(i<0)i=data.rounds.length-1;
    setRi(i);picked.current=true;
  },[loaded,data.rounds]);

  useEffect(()=>{
    const strip=stripRef.current;if(!strip)return;
    const el=strip.querySelector(".rchip.on");
    if(el)strip.scrollLeft=el.offsetLeft-strip.clientWidth/2+el.clientWidth/2;
  },[ri,data.rounds.length]);

  if(!data.rounds.length)return <div className="card empty">Chưa có vòng đấu nào — vào <b>Cài đặt</b> để tạo.</div>;
  const idx=Math.min(ri,data.rounds.length-1);
  const r=data.rounds[idx];
  const P=data.config.ptsWin;
  const s={"1":0,"2":0};r.matches.forEach(m=>{const w=winner(m);if(w)s[w]+=P;});
  const doneN=r.matches.filter(m=>winner(m)).length;
  const nextI=r.matches.findIndex(m=>!winner(m));
  const noMembers=!data.teams["1"].members.length||!data.teams["2"].members.length;
  const status=isDone(r)?["b-ok","HOÀN THÀNH"]:hasScore(r)?["b-live","ĐANG ĐẤU"]:["b-idle","CHƯA ĐẤU"];
  const diff=roundDiff(r);
  const dates=roundDates(data);
  const dd=dates[idx];
  const sortKey=idx+"|"+r.matches.length+"|"+sortTick;
  if(frozen.current.key!==sortKey){
    const und=[],dn=[];
    r.matches.forEach((m,i)=>(winner(m)?dn:und).push(i));
    frozen.current={key:sortKey,order:[...und,...dn],firstDone:dn.length?und.length:-1};
  }
  const order=frozen.current.order;
  const firstDone=frozen.current.firstDone;

  const addMatch=()=>{
    const tp=data.config.template;
    save(["rounds",idx,"matches"],[...r.matches,blankMatch(tp[r.matches.length%tp.length]||"")]);
  };
  const delMatch=mi=>{
    if(!confirm(`Xoá trận #${mi+1} của Vòng ${idx+1}?`))return;
    save(["rounds",idx,"matches"],r.matches.filter((_,j)=>j!==mi));
  };

  return(<>
    {noMembers&&<div className="banner"><span>Một đội chưa có thành viên.</span><button className="btn sm" onClick={()=>go("teams")}>Thêm ngay</button></div>}
    <div className="card" style={{padding:"12px 10px"}}>
      <div className="rstrip" ref={stripRef}>
        {data.rounds.map((x,i)=>{
          const cls=i===idx?" on":isDone(x)?" done":hasScore(x)?" part":"";
          return <button key={i} className={"rchip"+cls} onClick={()=>setRi(i)}><small>VÒNG</small>{i+1}<em>{fmtShort(dates[i].iso)}</em></button>;
        })}
      </div>
    </div>

    <div className="card">
      <div className="rhead">
        <button className="iconbtn" aria-label="Vòng trước" disabled={idx===0} onClick={()=>setRi(idx-1)}><IcLeft/></button>
        <h3>Vòng {idx+1}</h3>
        <span className={"badge "+status[0]}>{status[1]}</span>
        <button className="iconbtn" aria-label="Vòng sau" disabled={idx===data.rounds.length-1} onClick={()=>setRi(idx+1)}><IcRight/></button>
      </div>
      <div className="datebox">
        <span className="dicon">📅</span>
        <div className="dtxt">
          <b>{fmtLong(dd.iso)||"Chưa đặt ngày"}</b>
          <small>{idx===0?"Ngày bắt đầu giải":dd.manual?"Đã chỉnh tay":"Tự động: thứ 2 kế tiếp"}</small>
        </div>
        <label className="btn ghost sm dpick">Đổi ngày
          <input type="date" value={dd.iso} onClick={openPicker} onChange={e=>setRoundDate(data,save,idx,e.target.value)}/>
        </label>
        {dd.manual&&<button className="btn ghost sm" title="Trả về lịch tự động" onClick={()=>save(["rounds",idx,"date"],null)}>↺</button>}
      </div>
      <div className="duel">
        <div className="s"><div>{data.teams["1"].name}</div><b style={{color:"var(--t1)"}}>{s["1"]}</b></div>
        <div className="c">ĐIỂM</div>
        <div className="s"><div>{data.teams["2"].name}</div><b style={{color:"var(--t2)"}}>{s["2"]}</b></div>
      </div>
      <div className="prog"><i style={{width:(r.matches.length?doneN/r.matches.length*100:0)+"%"}}/></div>
      <div className="rmeta"><span><b>{doneN}/{r.matches.length}</b> trận xong</span><span>Hiệu số <b>{sgn(diff)}</b> cho {data.teams["1"].name}</span></div>
      {s["1"]===s["2"]&&doneN>0&&<div className="rmeta" style={{color:"var(--warn)",fontWeight:700}}>Đang hoà điểm vòng → phân định bằng hiệu số</div>}
    </div>

    {order.map((mi,k)=>(
      <React.Fragment key={idx+"-"+mi}>
        {k===firstDone&&k>0&&<div className="donesep"><span>Đã xong · {order.length-k} trận</span></div>}
        <MatchCard m={r.matches[mi]} mi={mi} ri={idx} data={data} save={save}
          isNext={mi===nextI} onDelete={()=>delMatch(mi)} onScoreBlur={resort}/>
      </React.Fragment>
    ))}
    <button className="btn ghost block" onClick={addMatch}>+ Thêm trận vào vòng {idx+1}</button>
  </>);
}

// ─── ANALYTICS ───────────────────────────────────────────────────────────────
function Analytics({data,an,openMember}){
  const [team,setTeam]=useState("all");
  const [rk,setRk]=useState("all");
  const [sort,setSort]=useState("pct");
  const list=Object.values(an.pl)
    .filter(x=>(team==="all"||x.team===team)&&(rk==="all"||x.rank===rk))
    .sort((a,b)=>{
      if(!a.p!==!b.p)return a.p?-1:1;
      if(sort==="pct")return(b.pct||0)-(a.pct||0)||b.w-a.w;
      if(sort==="w")return b.w-a.w||(b.pct||0)-(a.pct||0);
      if(sort==="diff")return b.diff-a.diff;
      return b.formW-a.formW||(b.pct||0)-(a.pct||0);
    });
  const SORTS=[["pct","Tỉ lệ thắng"],["w","Số thắng"],["diff","Hiệu số"],["form","Phong độ"]];
  return(<>
    <div className="card">
      <div className="ch"><h2>Phân tích thành viên</h2><span className="hint">Chạm để xem chi tiết</span></div>
      <div className="filters">
        <div className="seg">
          {[["all","Tất cả"],["1",data.teams["1"].name],["2",data.teams["2"].name]].map(([k,l])=><button key={k} className={team===k?"on":""} onClick={()=>setTeam(k)}>{l}</button>)}
        </div>
        <div className="seg">
          {[["all","Hạng"],["A","Hạng A"],["B","Hạng B"]].map(([k,l])=><button key={k} className={rk===k?"on":""} onClick={()=>setRk(k)}>{l}</button>)}
        </div>
      </div>
      <div className="lbl">Xếp theo</div>
      <div className="seg full" style={{marginBottom:6}}>
        {SORTS.map(([k,l])=><button key={k} className={sort===k?"on":""} onClick={()=>setSort(k)}>{l}</button>)}
      </div>
      <div className="plist">
        {list.length===0&&<div className="empty">Không có thành viên</div>}
        {list.map((x,i)=>(
          <button className="pr" key={x.name} onClick={()=>openMember(x.name)}>
            <Avatar x={x} pos={x.p?i+1:null} rank/>
            <div style={{minWidth:0}}>
              <div className="n1"><span className="t">{x.name}</span></div>
              <div className="n2">
                {x.p?<><span className="mono rec">{x.w}T-{x.l}B</span><span className="mono df">{sgn(x.diff)}</span><Form f={x.form}/></>:<span>Chưa thi đấu</span>}
              </div>
            </div>
            <div className="big">
              {sort==="diff"?sgn(x.diff):sort==="w"?x.w:sort==="form"?x.formW+"/"+x.form.length:pctTxt(x.pct)}
              <small>{sort==="diff"?"hiệu số":sort==="w"?"trận thắng":sort==="form"?"5 trận gần":"tỉ lệ thắng"}</small>
            </div>
          </button>
        ))}
      </div>
    </div>
  </>);
}

function Ring({v}){
  const r=34,c=2*Math.PI*r,p=v==null?0:v;
  return(
    <svg className="ring" viewBox="0 0 84 84" role="img" aria-label={"Tỉ lệ thắng "+pctTxt(v)}>
      <circle cx="42" cy="42" r={r} fill="none" stroke="#f1e6d1" strokeWidth="8"/>
      <circle cx="42" cy="42" r={r} fill="none" stroke="url(#rg)" strokeWidth="8" strokeLinecap="round"
        strokeDasharray={`${c*p} ${c}`} transform="rotate(-90 42 42)"/>
      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#f0d999"/><stop offset="1" stopColor="#a87a24"/></linearGradient></defs>
      <text x="42" y="47" textAnchor="middle" fill="#3b2a14" fontSize="18" fontWeight="800">{pctTxt(v)}</text>
    </svg>
  );
}

// Biểu đồ phân kỳ: mỗi cột là 1 trận, cao = cách biệt điểm (lên = thắng, xuống = thua)
function MarginChart({x,data}){
  const g=x.games;
  const [sel,setSel]=useState(g.length-1);
  useEffect(()=>setSel(g.length-1),[g.length]);
  const W=320,H=150,L=28,R=6,T=10,B=20;
  const n=g.length,iw=W-L-R,step=iw/Math.max(n,1);
  const bw=Math.max(3,Math.min(16,step*0.62));
  const max=Math.max(4,...g.map(y=>Math.abs(y.my-y.th)));
  const half=(H-T-B)/2,mid=T+half;
  const bar=(x0,v)=>{
    const h=Math.max(2,Math.abs(v)/max*half),r=Math.min(4,bw/2,h);
    const y=v>=0?mid-h:mid+h,s=v>=0?1:-1;
    return`M${x0},${mid}V${y+s*r}Q${x0},${y} ${x0+r},${y}H${x0+bw-r}Q${x0+bw},${y} ${x0+bw},${y+s*r}V${mid}Z`;
  };
  let lastLx=-99;
  const cur=g[Math.min(sel,n-1)];
  return(<>
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label="Cách biệt điểm từng trận">
      <line x1={L} x2={W-R} y1={T} y2={T} stroke="#efe4d0"/>
      <line x1={L} x2={W-R} y1={T+2*half} y2={T+2*half} stroke="#efe4d0"/>
      <text x={L-6} y={T+4} textAnchor="end" fontSize="9" fill="#9a8468">+{max}</text>
      <text x={L-6} y={mid+3} textAnchor="end" fontSize="9" fill="#9a8468">0</text>
      <text x={L-6} y={T+2*half+3} textAnchor="end" fontSize="9" fill="#9a8468">−{max}</text>
      {g.map((y,i)=>{
        const cx=L+i*step,x0=cx+(step-bw)/2,v=y.my-y.th;
        let lab=null;
        if((i===0||g[i-1].ri!==y.ri)&&cx-lastLx>=20){lastLx=cx;lab=<text x={cx+step/2} y={H-6} textAnchor="middle" fontSize="8.5" fill="#9a8468">V{y.ri+1}</text>;}
        return(
          <g key={i} onClick={()=>setSel(i)} onMouseEnter={()=>setSel(i)} style={{cursor:"pointer"}}>
            {i===sel&&<rect x={cx} y={T} width={step} height={2*half} rx="4" fill="rgba(201,161,74,.14)"/>}
            <path d={bar(x0,v)} fill={y.won?"var(--win)":"var(--loss)"} opacity={i===sel?1:.85}/>
            <rect x={cx} y={T} width={step} height={2*half} fill="transparent"/>
            {lab}
          </g>
        );
      })}
      <line x1={L} x2={W-R} y1={mid} y2={mid} stroke="#cdbb9a"/>
    </svg>
    <div className="legend" style={{marginTop:4}}>
      <span><span className="sw" style={{background:"var(--win)"}}/>Thắng</span>
      <span><span className="sw" style={{background:"var(--loss)"}}/>Thua</span>
      <span>Chiều cao = cách biệt điểm</span>
    </div>
    {cur&&<div className="tip">
      <span className="mono muted">V{cur.ri+1} · #{cur.mi+1} · {cleanLabel(cur.label)}</span><br/>
      <b style={{color:cur.won?"var(--gold2)":"var(--ink2)"}}>{cur.won?"Thắng":"Thua"} {cur.my}–{cur.th}</b>
      {cur.partners.length>0&&<> · cùng {cur.partners.join(", ")}</>} · gặp {cur.opps.join(" & ")||"—"}
    </div>}
  </>);
}

function RelTable({title,map,empty}){
  const rows=Object.entries(map).sort((a,b)=>b[1].p-a[1].p||b[1].w/b[1].p-a[1].w/a[1].p);
  return(
    <div className="card">
      <div className="ch"><h2>{title}</h2></div>
      {rows.length===0?<div className="empty">{empty}</div>:
      <table className="tbl">
        <thead><tr><th>Tên</th><th>Trận</th><th>Thắng</th><th>Tỉ lệ</th></tr></thead>
        <tbody>{rows.map(([n,q])=>{
          const p=q.w/q.p;
          return <tr key={n}><td>{n}</td><td className="mono">{q.p}</td><td className="mono">{q.w}</td>
            <td className="mono" style={{color:p>=0.6?"var(--good)":p<=0.34?"var(--warn)":"var(--ink2)"}}>{pctTxt(p)}</td></tr>;
        })}</tbody>
      </table>}
    </div>
  );
}

function MemberSheet({name,an,data,onClose}){
  const x=an.pl[name];
  useEffect(()=>{
    document.body.style.overflow="hidden";
    return()=>{document.body.style.overflow="";};
  },[]);
  if(!x)return null;
  const avg=an.rankAvg[x.rank];
  const ins=insights(x,an);
  const avgAll=(()=>{const xs=Object.values(an.pl);const p=xs.reduce((s,y)=>s+y.p,0),w=xs.reduce((s,y)=>s+y.w,0);return p?w/p:null;})();
  const best=Object.values(an.pl).filter(y=>y.rank===x.rank&&y.p>=3).sort((a,b)=>b.pct-a.pct)[0];
  return(
    <div className="sheet" role="dialog" aria-label={"Phân tích "+x.name}>
      <div className="sheet-in">
        <div className="shead">
          <Avatar x={x}/>
          <div style={{flex:1,minWidth:0}}>
            <h2>{x.name}</h2>
            <div className="sub"><span className="tdot" style={{background:TEAM_COLOR[x.team]}}/>{data.teams[x.team]?data.teams[x.team].name:""}{x.rank!=="?"&&<> · <span className={"rk "+x.rank}>{x.rank}</span> Hạng {x.rank}</>}</div>
          </div>
          <button className="iconbtn" aria-label="Đóng" onClick={onClose}><IcX/></button>
        </div>

        <div className="card">
          <div className="kgrid">
            <div className="kg hero2">
              <Ring v={x.pct}/>
              <div>
                <div className="eyebrow">Tỉ lệ thắng</div>
                <div className="mono" style={{fontSize:22,fontWeight:800,marginTop:2}}>{x.w}T – {x.l}B</div>
                <div style={{marginTop:6}}>{x.form.length?<Form f={x.form}/>:<span className="muted" style={{fontSize:12}}>Chưa thi đấu</span>}</div>
              </div>
            </div>
            <div className="kg"><b>{sgn(x.diff)}</b><span>Hiệu số</span></div>
            <div className="kg"><b>{x.pts}</b><span>Điểm góp đội</span></div>
            <div className="kg"><b>{x.p}</b><span>Trận đã đấu</span></div>
            <div className="kg"><b>{x.p?x.avgF.toFixed(1):"–"}</b><span>Ghi TB/trận</span></div>
            <div className="kg"><b>{x.p?x.avgA.toFixed(1):"–"}</b><span>Mất TB/trận</span></div>
            <div className="kg"><b>{x.closeW}-{x.closeL}</b><span>Sát nút T-B</span></div>
          </div>
        </div>

        <div className="card">
          <div className="ch"><h2>Gợi ý & nhận định</h2><span className="hint">Tự động</span></div>
          <div className="ins">
            {ins.map((it,i)=>(
              <div className={"in "+it.tone} key={i}><div className="ic">{it.ic}</div><div dangerouslySetInnerHTML={{__html:it.html}}/></div>
            ))}
          </div>
        </div>

        {x.p>0&&<div className="card">
          <div className="ch"><h2>Diễn biến từng trận</h2><span className="hint">Chạm cột để xem</span></div>
          <MarginChart x={x} data={data}/>
        </div>}

        {x.p>0&&<div className="card">
          <div className="ch"><h2>So sánh tỉ lệ thắng</h2></div>
          <div className="cmp">
            {[[x.name,x.pct,"var(--grad)"],[`TB Hạng ${x.rank}`,avg,"#cdbb9a"],["TB toàn giải",avgAll,"#e3d4b8"],
              ...(best&&best.name!==x.name?[[`Top Hạng ${x.rank}`,best.pct,"#cdbb9a"]]:[])].map(([l,v,c])=>(
              <div className="ln" key={l}><span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l}</span>
                <div className="tr"><i style={{width:(v||0)*100+"%",background:c}}/></div><span className="v">{pctTxt(v)}</span></div>
            ))}
          </div>
        </div>}

        <RelTable title="Theo đồng đội" map={x.partners} empty="Chưa có dữ liệu đánh cặp"/>
        <RelTable title="Theo đối thủ" map={x.opps} empty="Chưa có dữ liệu đối thủ"/>
      </div>
    </div>
  );
}

// ─── TEAMS ───────────────────────────────────────────────────────────────────
function TeamCard({t,data,save}){
  const team=data.teams[t];
  const [name,setName]=useState(team.name);
  useEffect(()=>setName(team.name),[team.name]);
  const [nm,setNm]=useState("");
  const [rk,setRk]=useState("A");
  const exists=n=>["1","2"].some(x=>data.teams[x].members.some(m=>m.name.toLowerCase()===n.toLowerCase()));

  const add=()=>{
    const n=nm.trim();if(!n)return;
    if(exists(n)){alert(`"${n}" đã có trong danh sách`);return;}
    save(["teams",t,"members"],[...team.members,{name:n,rank:rk}]);setNm("");
  };
  const remove=i=>{
    if(!confirm(`Xoá ${team.members[i].name} khỏi ${team.name}?`))return;
    save(["teams",t,"members"],team.members.filter((_,j)=>j!==i));
  };
  const rename=i=>{
    const old=team.members[i].name;
    const n=(prompt("Đổi tên thành viên",old)||"").trim();
    if(!n||n===old)return;
    if(n.toLowerCase()!==old.toLowerCase()&&exists(n)){alert(`"${n}" đã có trong danh sách`);return;}
    save(["teams",t,"members",i,"name"],n);
    const key=t==="1"?"a":"b";
    if(data.rounds.some(r=>r.matches.some(m=>m[key].includes(old))))
      save(["rounds"],data.rounds.map(r=>({...r,matches:r.matches.map(m=>({...m,[key]:m[key].map(x=>x===old?n:x)}))})));
  };

  const group=r=>{
    const list=team.members.map((m,i)=>({...m,i})).filter(m=>m.rank===r);
    return(
      <div className="group" key={r}>
        <div className="lbl" style={{display:"flex",alignItems:"center",gap:6}}><span className={"rk "+r}>{r}</span>Hạng {r} · {list.length}</div>
        {list.length===0&&<div className="muted" style={{fontSize:12,padding:"4px 0"}}>Chưa có</div>}
        {list.map(m=>(
          <div className="mem" key={m.name}>
            <span className="n">{m.name}</span>
            <div className="seg">
              {["A","B"].map(x=><button key={x} className={m.rank===x?"on":""} onClick={()=>m.rank!==x&&save(["teams",t,"members",m.i,"rank"],x)}>{x}</button>)}
            </div>
            <button className="iconbtn" aria-label="Đổi tên" onClick={()=>rename(m.i)}><IcPen/></button>
            <button className="iconbtn" aria-label="Xoá" onClick={()=>remove(m.i)}><IcTrash/></button>
          </div>
        ))}
      </div>
    );
  };

  return(
    <div className="card" style={{borderTop:`3px solid ${TEAM_HEX[t]}`}}>
      <div className="thead">
        <span className="tdot" style={{background:TEAM_COLOR[t],width:12,height:12}}/>
        <input className="field" value={name} onChange={e=>setName(e.target.value)}
          onBlur={()=>{const v=name.trim()||("Team "+t);setName(v);if(v!==team.name)save(["teams",t,"name"],v);}}/>
      </div>
      {group("A")}
      {group("B")}
      <div className="addrow">
        <input className="field" placeholder="Tên thành viên mới" value={nm} onChange={e=>setNm(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
        <div className="seg">
          {["A","B"].map(x=><button key={x} className={rk===x?"on":""} onClick={()=>setRk(x)}>{x}</button>)}
        </div>
        <button className="btn" onClick={add}>Thêm</button>
      </div>
    </div>
  );
}

// ─── SETTINGS ────────────────────────────────────────────────────────────────
function Settings({data,save}){
  const [pts,setPts]=useState(String(data.config.ptsWin));
  useEffect(()=>setPts(String(data.config.ptsWin)),[data.config.ptsWin]);
  const [nr,setNr]=useState(String(data.rounds.length));
  useEffect(()=>setNr(String(data.rounds.length)),[data.rounds.length]);
  const [nl,setNl]=useState("");
  const fileRef=useRef(null);
  const tp=data.config.template;

  const applyPts=()=>{const n=parseInt(pts);if(n>0&&n!==data.config.ptsWin)save(["config","ptsWin"],n);else setPts(String(data.config.ptsWin));};
  const applyRounds=()=>{
    const n=Math.max(1,Math.min(60,parseInt(nr)||0));
    const cur=data.rounds;
    if(!n||n===cur.length){setNr(String(cur.length));return;}
    if(n>cur.length){save(["rounds"],[...cur,...buildRounds(n-cur.length,tp)]);return;}
    if(cur.slice(n).some(hasData)&&!confirm(`Các vòng ${n+1}–${cur.length} đã có dữ liệu và sẽ bị xoá. Tiếp tục?`)){setNr(String(cur.length));return;}
    save(["rounds"],cur.slice(0,n));
  };
  const setTp=next=>save(["config","template"],next);
  const move=(i,d)=>{const j=i+d;if(j<0||j>=tp.length)return;const n=[...tp];[n[i],n[j]]=[n[j],n[i]];setTp(n);};
  const addTp=()=>{const v=nl.trim();if(!v)return;setTp([...tp,v]);setNl("");};
  const delTp=i=>{if(tp.length<=1){alert("Cần ít nhất 1 trận mỗi vòng");return;}setTp(tp.filter((_,j)=>j!==i));};
  const renameTp=i=>{const v=(prompt("Tên trận",tp[i])||"").trim();if(v&&v!==tp[i])setTp(tp.map((x,j)=>j===i?v:x));};

  const emptyRounds=data.rounds.filter(r=>!hasData(r)).length;
  const dates=roundDates(data);
  const manualN=dates.filter(d=>d.manual).length;
  const resetDates=()=>{
    if(!confirm("Bỏ toàn bộ ngày đã chỉnh tay, xếp lại tất cả các vòng vào thứ 2 hàng tuần?"))return;
    data.rounds.forEach((r,i)=>{if(r.date)save(["rounds",i,"date"],null);});
  };
  const applyTemplate=()=>{
    if(!emptyRounds){alert("Không còn vòng nào trống để áp dụng");return;}
    if(!confirm(`Áp dụng thể thức (${tp.length} trận) cho ${emptyRounds} vòng chưa nhập dữ liệu?`))return;
    save(["rounds"],data.rounds.map(r=>hasData(r)?r:{...r,matches:tp.map(blankMatch)}));
  };

  const exportJson=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="edutalk-pickleball-"+new Date().toISOString().slice(0,10)+".json";a.click();
  };
  const importJson=e=>{
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=normalize(JSON.parse(rd.result));
        if(confirm("Ghi đè toàn bộ dữ liệu hiện tại bằng file này?"))save([],d);
      }catch(err){alert("File không hợp lệ");}
      e.target.value="";
    };
    rd.readAsText(f);
  };
  const clearResults=()=>{
    if(!confirm("Xoá toàn bộ tỉ số của mọi vòng? (Giữ nguyên thành viên, cặp đánh và thể thức)"))return;
    save(["rounds"],data.rounds.map(r=>({...r,matches:r.matches.map(m=>({...m,sa:"",sb:""}))})));
  };

  return(<>
    <div className="card">
      <div className="ch"><h2>Tính điểm & số vòng</h2></div>
      <div className="set">
        <div><div className="t">Điểm mỗi trận thắng</div><div className="d">Cộng cho đội thắng trận</div></div>
        <input className="field num" type="number" inputMode="numeric" value={pts} onChange={e=>setPts(e.target.value)} onBlur={applyPts}/>
      </div>
      <div className="set">
        <div><div className="t">Số vòng đấu</div><div className="d">Hiện có {data.rounds.length} vòng</div></div>
        <div className="row">
          <input className="field num" type="number" inputMode="numeric" value={nr} onChange={e=>setNr(e.target.value)}/>
          <button className="btn sm" onClick={applyRounds}>Lưu</button>
        </div>
      </div>
    </div>

    <div className="card">
      <div className="ch"><h2>Lịch thi đấu</h2><span className="hint">Thứ 2 hàng tuần</span></div>
      {dates.map((d,i)=>(
        <div className="set" key={i}>
          <div><div className="t">Vòng {i+1}</div>
            <div className="d">{fmtLong(d.iso)||"Chưa đặt ngày"}{i===0?" · bắt đầu giải":d.manual?" · chỉnh tay":""}</div></div>
          <div className="row">
            {d.manual&&<button className="btn ghost sm" title="Trả về lịch tự động" onClick={()=>save(["rounds",i,"date"],null)}>↺</button>}
            <label className="btn ghost sm dpick">Đổi
              <input type="date" value={d.iso} onClick={openPicker} onChange={e=>setRoundDate(data,save,i,e.target.value)}/>
            </label>
          </div>
        </div>
      ))}
      {manualN>0&&<button className="btn ghost block" style={{marginTop:10}} onClick={resetDates}>Bỏ {manualN} ngày chỉnh tay, xếp lại thứ 2 hàng tuần</button>}
      <div className="hint" style={{marginTop:8}}>Sửa ngày một vòng thì các vòng sau (chưa chỉnh tay) tự dời sang thứ 2 kế tiếp.</div>
    </div>

    <div className="card">
      <div className="ch"><h2>Thể thức mỗi vòng</h2><span className="hint">{tp.length} trận, đấu lần lượt</span></div>
      {tp.map((x,i)=>(
        <div className="tpl" key={i+x}>
          <span className="i">{i+1}</span>
          <span className="n">{x}</span>
          <button className="iconbtn" aria-label="Lên" onClick={()=>move(i,-1)} disabled={i===0}><IcUp/></button>
          <button className="iconbtn" aria-label="Xuống" onClick={()=>move(i,1)} disabled={i===tp.length-1}><IcDown/></button>
          <button className="iconbtn" aria-label="Sửa" onClick={()=>renameTp(i)}><IcPen/></button>
          <button className="iconbtn" aria-label="Xoá" onClick={()=>delTp(i)}><IcTrash/></button>
        </div>
      ))}
      <div className="row" style={{marginTop:10}}>
        <input className="field" placeholder="VD: Đôi Hạng A · 18:30" value={nl} onChange={e=>setNl(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTp()}/>
        <button className="btn" onClick={addTp}>Thêm</button>
      </div>
      <button className="btn ghost block" style={{marginTop:10}} onClick={applyTemplate}>Áp dụng cho {emptyRounds} vòng chưa nhập</button>
      <div className="hint" style={{marginTop:8}}>Vòng đã có dữ liệu (cặp đánh hoặc tỉ số) giữ nguyên. Thêm giờ vào cuối tên trận (VD “· 18:30”) để hiện giờ thi đấu.</div>
    </div>

    <div className="card">
      <div className="ch"><h2>Dữ liệu</h2></div>
      <div className="row" style={{flexWrap:"wrap"}}>
        <button className="btn ghost sm" onClick={exportJson}>Xuất file sao lưu</button>
        <button className="btn ghost sm" onClick={()=>fileRef.current.click()}>Nhập từ file</button>
        <button className="btn danger sm" onClick={clearResults}>Xoá toàn bộ tỉ số</button>
        <input ref={fileRef} type="file" accept="application/json,.json" hidden onChange={importJson}/>
      </div>
      <div className="hint" style={{marginTop:10}}>Giải cũ (3 đội) vẫn ở: <a href="../">tuanle-coder.github.io/pickleball-league</a></div>
    </div>
  </>);
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App(){
  const {data,status,loaded,save}=useLeague();
  const [tab,setTab]=useState("home");
  const [member,setMember]=useState(null);
  const st=useMemo(()=>computeStats(data),[data]);
  const an=useMemo(()=>analyze(data),[data]);
  const go=t=>{setTab(t);window.scrollTo({top:0});};

  // nút Back của điện thoại đóng trang chi tiết thành viên
  const openMember=n=>{history.pushState({sheet:n},"");setMember(n);};
  const closeMember=()=>history.back();
  useEffect(()=>{
    const onPop=()=>setMember(null);
    window.addEventListener("popstate",onPop);
    return()=>window.removeEventListener("popstate",onPop);
  },[]);

  const TABS=[["home","Tổng quan",IcHome],["entry","Nhập liệu",IcEdit],["stats","Phân tích",IcChart],["teams","Đội",IcUsers],["settings","Cài đặt",IcSliders]];
  return(
    <div className="app">
      <TopBar data={data} st={st} status={status} tab={tab}/>
      <main>
        {tab==="home"&&<Overview data={data} st={st} an={an} go={go} openMember={openMember}/>}
        {tab==="entry"&&<Entry data={data} save={save} loaded={loaded} go={go}/>}
        {tab==="stats"&&<Analytics data={data} an={an} openMember={openMember}/>}
        {tab==="teams"&&<>{["1","2"].map(t=><TeamCard key={t} t={t} data={data} save={save}/>)}</>}
        {tab==="settings"&&<Settings data={data} save={save}/>}
      </main>
      <nav className="tabbar">
        {TABS.map(([k,l,I])=><button key={k} className={tab===k?"on":""} onClick={()=>go(k)}><I/>{l}</button>)}
      </nav>
      {member&&<MemberSheet name={member} an={an} data={data} onClose={closeMember}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
